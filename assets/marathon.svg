<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI',Helvetica,Arial,sans-serif" role="img" aria-label="claude-m marathon flow: work until the 5-hour usage limit, checkpoint to TASK_STATE.md, wait for the window to reset, then resume — driven by a shared daemon.">
  <style>
    .bg      { fill:#0f172a; }
    .panel   { fill:#1e293b; stroke:#334155; stroke-width:1; }
    .title   { fill:#e2e8f0; font-size:20px; font-weight:700; }
    .sub     { fill:#94a3b8; font-size:12.5px; }
    .lbl     { fill:#e2e8f0; font-size:14px; font-weight:600; }
    .cap     { fill:#94a3b8; font-size:11.5px; }
    .mono    { font-family:'SF Mono',ui-monospace,Menlo,Consolas,monospace; }
    .track   { fill:#0b1220; stroke:#334155; stroke-width:1; }
    .wall    { stroke:#ef4444; stroke-width:1.5; stroke-dasharray:4 3; }
    .arrow   { stroke:#475569; stroke-width:2; fill:none; marker-end:url(#ah); }

    /* usage bar grows to ~90%, holds through checkpoint+wait, snaps back on reset */
    /* base state = graceful fallback if CSS animation doesn't run (near the wall) */
    .bar { transform-box:fill-box; transform-origin:left center; fill:#ef4444; transform:scaleX(.92); animation:grow 12s ease-in-out infinite; }
    @keyframes grow {
      0%   { transform:scaleX(.02); fill:#22c55e; }
      28%  { transform:scaleX(.52); fill:#f59e0b; }
      40%  { transform:scaleX(.92); fill:#ef4444; }
      80%  { transform:scaleX(.92); fill:#ef4444; }
      86%  { transform:scaleX(.02); fill:#22c55e; }
      100% { transform:scaleX(.02); fill:#22c55e; }
    }
    /* phase cards light up in sequence */
    .ph { opacity:.4; }
    .p1 { animation:a1 12s ease-in-out infinite; }
    .p2 { animation:a2 12s ease-in-out infinite; }
    .p3 { animation:a3 12s ease-in-out infinite; }
    .p4 { animation:a4 12s ease-in-out infinite; }
    @keyframes a1 { 0%,36%{opacity:1} 42%,100%{opacity:.38} }
    @keyframes a2 { 0%,36%{opacity:.38} 42%,50%{opacity:1} 56%,100%{opacity:.38} }
    @keyframes a3 { 0%,50%{opacity:.38} 56%,78%{opacity:1} 84%,100%{opacity:.38} }
    @keyframes a4 { 0%,78%{opacity:.38} 84%,92%{opacity:1} 98%,100%{opacity:.38} }
    /* TASK_STATE.md doc: written at checkpoint, persists until resume */
    .doc { animation:doc 12s ease-in-out infinite; }
    @keyframes doc { 0%,37%{opacity:0} 43%,83%{opacity:1} 90%,100%{opacity:0} }
    /* daemon poll pulse */
    .poll { animation:poll 2s ease-in-out infinite; }
    @keyframes poll { 0%,100%{opacity:.25} 50%{opacity:1} }
    /* reset flash near resume */
    .flash { animation:flash 12s ease-in-out infinite; }
    @keyframes flash { 0%,80%{opacity:0} 85%{opacity:.9} 92%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce){
      .bar,.p1,.p2,.p3,.p4,.doc,.poll,.flash{animation:none}
      .ph{opacity:1}.bar{transform:scaleX(.92);fill:#ef4444}.doc{opacity:1}
    }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="470" rx="14"/>

  <!-- header -->
  <text class="title" x="30" y="42">claude-m marathon — surviving the 5-hour limit, unattended</text>
  <text class="sub"   x="30" y="64">One tagged tmux session + one shared daemon = work that checkpoints and auto-resumes across resets.</text>

  <!-- daemon -->
  <g transform="translate(30,88)">
    <rect class="panel" x="0" y="0" width="860" height="40" rx="8"/>
    <circle class="poll" cx="22" cy="20" r="6" fill="#38bdf8"/>
    <text class="lbl"  x="40" y="18">shared <tspan class="mono">marathon-daemon</tspan></text>
    <text class="cap"  x="40" y="33">polls account usage every 60s · drives every <tspan class="mono">@claude_marathon</tspan> session at once</text>
    <text class="cap" x="840" y="25" text-anchor="end">1 poll ▸ N sessions</text>
  </g>

  <!-- 5-hour usage bar -->
  <g transform="translate(30,150)">
    <text class="lbl" x="0" y="14">5-hour usage</text>
    <rect class="track" x="120" y="2" width="670" height="18" rx="9"/>
    <rect class="bar"   x="120" y="2" width="670" height="18" rx="9"/>
    <!-- 90% wall -->
    <line class="wall" x1="736" y1="-4" x2="736" y2="26"/>
    <text x="736" y="-8" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="700">90% wall</text>
    <text class="cap" x="800" y="15">↺ resets</text>
  </g>

  <!-- phase flow -->
  <g transform="translate(30,210)">
    <!-- connectors -->
    <path class="arrow" d="M205,55 L235,55"/>
    <path class="arrow" d="M425,55 L455,55"/>
    <path class="arrow" d="M645,55 L675,55"/>
    <!-- loop back arrow RESUME -> WORK -->
    <path class="arrow" d="M755,110 q30,55 -350,55 l-300,0 q-40,0 -40,-40 l0,-9"/>
    <text class="cap" x="330" y="182" text-anchor="middle">loop — session stays alive the whole time</text>

    <!-- 1. WORK -->
    <g class="ph p1">
      <rect class="panel" x="0" y="20" width="205" height="70" rx="10"/>
      <text class="lbl" x="16" y="46">▶ WORK</text>
      <text class="cap" x="16" y="64">usage climbs;</text>
      <text class="cap" x="16" y="79">hooks silent &lt; 80%</text>
    </g>
    <!-- 2. CHECKPOINT -->
    <g class="ph p2">
      <rect class="panel" x="235" y="20" width="190" height="70" rx="10" stroke="#f59e0b"/>
      <text class="lbl" x="251" y="46" fill="#fbbf24">⏸ 90% → CHECKPOINT</text>
      <text class="cap" x="251" y="64">daemon → write</text>
      <text class="cap mono" x="251" y="79">TASK_STATE.md</text>
    </g>
    <!-- 3. WAIT -->
    <g class="ph p3">
      <rect class="panel" x="455" y="20" width="190" height="70" rx="10"/>
      <text class="lbl" x="471" y="46">⏳ WAIT FOR RESET</text>
      <text class="cap mono" x="471" y="64">sleep → resets_at</text>
      <text class="cap" x="471" y="79">+ buffer, then verify</text>
    </g>
    <!-- 4. RESUME -->
    <g class="ph p4">
      <rect class="panel" x="675" y="20" width="185" height="70" rx="10" stroke="#38bdf8"/>
      <rect class="flash" x="675" y="20" width="185" height="70" rx="10" fill="#38bdf8" opacity="0"/>
      <text class="lbl" x="691" y="46" fill="#7dd3fc">↻ RESUME</text>
      <text class="cap" x="691" y="64">read checkpoint,</text>
      <text class="cap" x="691" y="79">continue where left off</text>
    </g>
  </g>

  <!-- persisted TASK_STATE.md doc -->
  <g class="doc" transform="translate(392,412)">
    <rect x="0" y="0" width="136" height="30" rx="6" fill="#0b1220" stroke="#f59e0b" stroke-width="1"/>
    <path d="M12,7 h10 l4,4 v12 h-14 z" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
    <text class="cap mono" x="34" y="19" fill="#fbbf24">TASK_STATE.md</text>
  </g>
</svg>
